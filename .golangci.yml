---
version: "2"
# Configure which files to skip during linting
run:
  tests: false

linters:
  default: all

  disable:
    - wsl
    - wsl_v5
    - nlreturn
    - depguard
    - gochecknoinits
    - gochecknoglobals
    - forbidigo
    - varnamelen
    - exhaustruct
    - exhaustruct_v5
    - tagliatelle
    - noinlineerr
    - ireturn
    - gomodguard
    - lll

  settings:
    wrapcheck:
      # internal/errors (imported as apperrors) is where AppError values are
      # constructed; its constructors originate errors, so there is nothing
      # to wrap. wrapcheck started flagging returns of these constructors
      # (which return *apperrors.AppError) with golangci-lint 2.15.
      ignore-package-globs:
        - github.com/sgaunet/runrun/internal/errors
