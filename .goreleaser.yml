# ============================================================================
# GoReleaser Configuration for RunRun
# ============================================================================

version: 2

# ============================================================================
# Project Metadata
# ============================================================================
project_name: runrun

# ============================================================================
# Build Configuration
# ============================================================================
before:
  hooks:
    # Install templ CLI for template generation
    - go install github.com/a-h/templ/cmd/templ@latest
    # Generate templ templates
    - templ generate
    # Sync the dev static tree into the embed tree (Bulma + Alpine + sprite)
    - sh -c 'mkdir -p internal/assets/static && rsync -a --delete --exclude=.DS_Store internal/server/static/ internal/assets/static/'
    # Ensure generated files are present
    - go mod tidy

builds:
  - id: runrun
    main: ./cmd/runrun
    binary: runrun

    env:
      - CGO_ENABLED=0

    # Version information embedded in binary
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X github.com/sgaunet/runrun/internal/version.Version={{.Version}}
      - -X github.com/sgaunet/runrun/internal/version.Commit={{.Commit}}
      - -X github.com/sgaunet/runrun/internal/version.BuildDate={{.Date}}

    # Target platforms
    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64
      - arm

    goarm:
      - "7"

    # Ignore specific combinations
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

# ============================================================================
# Archive Configuration
# ============================================================================
archives:
  - id: default
    format: tar.gz

    # Use zip for Windows
    format_overrides:
      - goos: windows
        format: zip

    # Archive name template
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    # Files to include in archives
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - configs/example.yaml
      - internal/server/static/**/*
      - docs/**/*

# ============================================================================
# Checksum Configuration
# ============================================================================
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# ============================================================================
# Snapshot Configuration
# ============================================================================
snapshot:
  name_template: "{{ incpatch .Version }}-next"

# ============================================================================
# Changelog Configuration
# ============================================================================
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: 'Documentation'
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Other Changes
      order: 999

# ============================================================================
# Release Configuration
# ============================================================================
release:
  github:
    owner: sgaunet
    name: runrun

  draft: false
  prerelease: auto

  # Release name template
  name_template: "{{.ProjectName}} v{{.Version}}"

  # Header and footer for release notes
  header: |
    ## RunRun {{ .Version }}

    Production-ready web-based task execution platform.

    ### Installation

    Download the appropriate binary for your platform below, extract it, and run:

    ```bash
    ./runrun server --config configs/example.yaml
    ```

  footer: |
    ### Full Changelog

    See [CHANGELOG.md](https://github.com/sgaunet/runrun/blob/main/CHANGELOG.md) for complete details.

# ============================================================================
# Additional Files Configuration
# ============================================================================
# Source distribution
source:
  enabled: true
  name_template: '{{ .ProjectName }}-{{ .Version }}-source'
  format: 'tar.gz'
