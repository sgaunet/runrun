# https://taskfile.dev
version: "3"
includes:
  dev: ./Taskfile_dev.yml

vars:
  BINFILE: runrun
  # Static asset trees (kept byte-identical by sync-assets)
  STATIC_SRC: internal/server/static
  STATIC_EMBED: internal/assets/static
  # Required embedded assets (audit-assets fails if any are missing)
  REQUIRED_ASSETS: >-
    css/bulma.min.css
    css/app.css
    js/vendor/alpine.csp.min.js
    js/main.js
    js/log-viewer.js
    icons/sprite.svg
    favicon.ico
  # Forbidden legacy assets (audit-assets fails if any are present)
  FORBIDDEN_FILES: >-
    {{.STATIC_SRC}}/css/input.css
    {{.STATIC_SRC}}/css/styles.css
    {{.STATIC_SRC}}/css/style.css
    {{.STATIC_EMBED}}/css/input.css
    {{.STATIC_EMBED}}/css/styles.css
    {{.STATIC_EMBED}}/css/style.css
    tailwind.config.js
    tools/tailwindcss

tasks:
  vulncheck:
    desc: "Scan dependencies for known vulnerabilities"
    cmds:
      - go tool templ generate
      - govulncheck ./...

  default:
    desc: "List available tasks"
    preconditions:
      - test -f .git/hooks/pre-commit
    cmds:
      - task -a

  check-before-commit:
    desc: "Run checks before committing"
    preconditions:
      - test -f .git/hooks/pre-commit
    deps:
      - test
      - snapshot
    cmds:
      - task: lint

  install-tools:
    desc: "Optional: pre-build the templ tool (already pinned in go.mod as a `tool` dependency; `go tool templ` fetches/builds it on demand otherwise)"
    cmds:
      - go tool templ --version

  generate:
    desc: "Generate templ templates"
    cmds:
      - go tool templ generate

  sync-assets:
    desc: "Sync internal/server/static/ -> internal/assets/static/ (byte-identical)"
    cmds:
      - mkdir -p {{.STATIC_EMBED}}
      - rsync -a --delete --exclude='.DS_Store' {{.STATIC_SRC}}/ {{.STATIC_EMBED}}/
      - |
        if ! diff -r --no-dereference {{.STATIC_SRC}} {{.STATIC_EMBED}} > /dev/null 2>&1; then
          echo 'sync-assets: trees diverged after rsync' >&2
          exit 1
        fi

  audit-assets:
    desc: "Verify required assets exist and forbidden artifacts are absent"
    cmds:
      - |
        missing=0
        for f in {{.REQUIRED_ASSETS}}; do
          for tree in {{.STATIC_SRC}} {{.STATIC_EMBED}}; do
            if [ ! -f "$tree/$f" ]; then
              echo "audit-assets: missing $tree/$f" >&2
              missing=1
            fi
          done
        done
        if [ $missing -ne 0 ]; then exit 1; fi
      - |
        present=0
        for f in {{.FORBIDDEN_FILES}}; do
          if [ -e "$f" ]; then
            echo "audit-assets: forbidden artifact present: $f" >&2
            present=1
          fi
        done
        if [ $present -ne 0 ]; then exit 1; fi

  build-all:
    desc: "Generate templates, sync+audit assets, and build the application"
    deps: [generate, sync-assets, audit-assets, build]

  lint:
    desc: "Run golangci-lint"
    cmds:
      - go tool templ generate
      - golangci-lint run

  test:
    desc: "Run unit tests with race detection"
    deps: [generate]
    cmds:
      - go tool templ generate
      - go test -count=2 -race ./...

  build:
    desc: "Build the application"
    deps: [generate, sync-assets, audit-assets]
    cmds:
      - CGO_ENABLED=0 go build -o {{.BINFILE}} ./cmd/runrun

  image:
    desc: "Build and push Docker image"
    deps:
      - build
    cmds:
      - docker build --no-cache --build-arg VERSION=development . -t ghcr.io/sgaunet/runrun:latest
      - docker push ghcr.io/sgaunet/runrun:latest

  run:
    desc: "Run the server (development mode)"
    deps: [generate, sync-assets]
    cmds:
      - go run ./cmd/runrun server --config configs/example.yaml

  doc:
    desc: "Start godoc documentation server"
    cmds:
      - echo http://localhost:6060
      - godoc -http=:6060

  snapshot:
    desc: "Create snapshot release with goreleaser"
    cmds:
      - goreleaser --clean --snapshot

  release:
    desc: "Create production release with goreleaser"
    cmds:
      - goreleaser --clean

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -f {{.BINFILE}}
      - find . -name "*_templ.go" -type f -delete

  hash-password:
    desc: "Hash a password for configuration (usage: task hash-password PASS=yourpassword)"
    cmds:
      - |
        if [ -z "{{.PASS}}" ]; then
          echo "Usage: task hash-password PASS=yourpassword"
          exit 1
        fi
        ./runrun hash-password {{.PASS}}
